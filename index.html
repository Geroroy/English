<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <meta name="description" content="하루 10분, 실생활 영어회화에서 영작까지">
  <title>10분 영어</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">10분 영어</div>
    <div class="topbar-right">
      <span id="timer" class="timer" hidden>10:00</span>
      <span id="streak" class="streak" title="연속 학습일">🔥 0</span>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="메뉴">
    <button data-tab="home" class="active"><span>🏠</span>오늘</button>
    <button data-tab="review"><span>🔁</span>복습</button>
    <button data-tab="journal"><span>✍️</span>작문노트</button>
    <button data-tab="progress"><span>📈</span>진도</button>
  </nav>

  <script src="js/lessons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
