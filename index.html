<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="description" content="영어 훈련소 — 초보·중급·고급 올인원 영어 패키지">
  <title>영어 훈련소</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-the">English</span> 훈련소</div>
    <div class="clock" aria-live="off">
      <span id="timer" class="timer idle" role="timer" aria-label="남은 시간">10:00</span>
    </div>
    <div style="justify-self:end;display:flex;align-items:center;gap:8px"><span title="베타 테스트 버전" style="font-family:var(--font-mono);font-size:.55rem;font-weight:600;letter-spacing:.06em;border:1px solid currentColor;padding:1px 4px;border-radius:2px;color:var(--brass)">BETA</span><div id="streak" class="streak" title="연속 학습일"></div></div>
    <div class="reel" aria-hidden="true"><i id="reel"></i></div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="메뉴">
    <button data-tab="home" class="active" data-icon="home">오늘</button>
    <button data-tab="review" data-icon="review">복습</button>
    <button data-tab="journal" data-icon="pen">작문노트</button>
    <button data-tab="progress" data-icon="chart">기록</button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/content/private.js"></script>
  <script src="js/content/pfc.js"></script>
  <script src="js/content/corporal.js"></script>
  <script src="js/content/sergeant.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/core.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
